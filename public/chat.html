<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title data-i18n="chat.title">Chat — LAAM</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/vendor/leaflet.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236d5efc'/><text x='50' y='68' font-size='52' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>L</text></svg>" />
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/vendor/chart.umd.min.js"></script>
  <script src="/vendor/leaflet.js"></script>
</head>
<body>
  <header id="topbar"></header>

  <main id="chat" class="chat">
    <!-- Conversation history sidebar — filled by chat-history.js -->
    <aside id="chat-sidebar" class="chat-sidebar" data-i18n-aria="chat.sidebarAria" aria-label="Lịch sử trò chuyện"></aside>
    <!-- Click-catcher behind the mobile drawer -->
    <div id="sidebar-scrim" class="sidebar-scrim" hidden></div>

    <section id="chat-main" class="chat-main">
      <div class="chat-sub" id="chat-sub">
        <button id="sidebar-toggle" class="sidebar-toggle" data-i18n-title="chat.sidebarToggleTitle" data-i18n-aria="chat.sidebarToggleAria" title="Lịch sử trò chuyện" aria-label="Bật/tắt lịch sử"></button>
        <div id="chat-sub-info" class="chat-sub-info"></div>
        <div class="chat-sub-spacer"></div>
        <!-- Toolbar buttons (settings, export, …) — filled by feature modules -->
        <div id="chat-toolbar" class="chat-toolbar"></div>
      </div>

      <div class="transcript" id="transcript" role="log" aria-live="polite" data-i18n-aria="chat.transcriptAria" aria-label="Nội dung trò chuyện"></div>

      <!-- Scroll-to-bottom FAB — managed by chat-composer.js -->
      <button id="scroll-bottom" class="scroll-bottom" hidden data-i18n-aria="chat.scrollBottomAria" aria-label="Cuộn xuống cuối"></button>

      <div class="dock">
        <div class="attachments" id="attachments"></div>
        <!-- Composer add-ons (token counter, slash menu, …) — chat-composer.js -->
        <div id="composer-toolbar" class="composer-toolbar"></div>
        <div class="dock-inner">
          <button class="attach" id="attach-file" data-i18n-title="chat.attachFileTitle" data-i18n-aria="chat.attachFileAria" title="Đính kèm file (txt/md/csv/pdf)" aria-label="Đính kèm file"></button>
          <button class="attach" id="attach-url" data-i18n-title="chat.attachUrlTitle" data-i18n-aria="chat.attachUrlAria" title="Đọc nội dung một URL" aria-label="Đọc một URL"></button>
          <button class="attach" id="attach-loc" data-i18n-title="chat.locTitle" data-i18n-aria="chat.locTitle" title="Dùng vị trí hiện tại của tôi" aria-label="Dùng vị trí hiện tại của tôi"></button>
          <textarea id="input" rows="1" data-i18n-ph="chat.inputPh" data-i18n-aria="chat.inputAria" placeholder="Nhắn cho Qwen… (Enter để gửi, Shift+Enter xuống dòng)" aria-label="Soạn tin nhắn"></textarea>
          <button class="send" id="send" data-i18n="chat.send">Gửi</button>
          <button class="stop" id="stop" hidden data-i18n="chat.stop">Dừng</button>
        </div>
        <input type="file" id="file-input" hidden accept=".txt,.md,.csv,.json,.log,.pdf,.png,.jpg,.jpeg,.webp,.bmp,.gif,.tif,.tiff,image/*" />
      </div>
    </section>
  </main>

  <!-- Shared utilities + rich-render pipeline (load before the kernel) -->
  <script src="/i18n.js"></script>
  <script src="/i18n.chat.js"></script>
  <script src="/vendor/lucide-icons.js"></script>
  <script src="/common.js"></script>
  <script src="/chat-render.js"></script>
  <script src="/chat-geo.js"></script>
  <script src="/chat-ingest.js"></script>

  <!-- Feature modules: each registers itself into window.LAAM_CHAT_MODULES and
       is initialised by the kernel (chat.js) after the store is built. They must
       NOT run logic at load time beyond the registry push. -->
  <script src="/chat-history.js"></script>
  <script src="/chat-actions.js"></script>
  <script src="/chat-composer.js"></script>
  <script src="/chat-settings.js"></script>
  <script src="/chat-export.js"></script>
  <script src="/chat-ux.js"></script>

  <!-- Kernel: builds window.LAAMChat, then initialises every registered module.
       MUST load last. -->
  <script src="/chat.js"></script>
</body>
</html>
