<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat — LAAM</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/vendor/leaflet.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236d5efc'/><text x='50' y='68' font-size='52' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>L</text></svg>" />
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/vendor/chart.umd.min.js"></script>
  <script src="/vendor/leaflet.js"></script>
</head>
<body>
  <header id="topbar"></header>

  <main id="chat" class="chat">
    <div class="chat-sub" id="chat-sub"></div>
    <div class="transcript" id="transcript"></div>
    <div class="dock">
      <div class="attachments" id="attachments"></div>
      <div class="dock-inner">
        <button class="attach" id="attach-file" title="Đính kèm file (txt/md/csv/pdf)">📎</button>
        <button class="attach" id="attach-url" title="Đọc nội dung một URL">🔗</button>
        <textarea id="input" rows="1" placeholder="Nhắn cho Qwen… (Enter để gửi, Shift+Enter xuống dòng)"></textarea>
        <button class="send" id="send">Gửi</button>
        <button class="stop" id="stop" hidden>Dừng</button>
      </div>
      <input type="file" id="file-input" hidden accept=".txt,.md,.csv,.json,.log,.pdf" />
    </div>
  </main>

  <script src="/common.js"></script>
  <script src="/chat-render.js"></script>
  <script src="/chat-ingest.js"></script>
  <script src="/chat.js"></script>
</body>
</html>
