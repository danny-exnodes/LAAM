<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — LAAM</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236d5efc'/><text x='50' y='68' font-size='52' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>L</text></svg>" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <header id="topbar"></header>

  <main id="main" class="dash">
    <div class="kpis" id="kpis"></div>

    <div class="charts">
      <div class="chart-card"><h3>Trạng thái session</h3><div class="cwrap"><canvas id="c-status"></canvas></div></div>
      <div class="chart-card"><h3>Phân bố theo model</h3><div class="cwrap"><canvas id="c-model"></canvas></div></div>
      <div class="chart-card"><h3>Phân bố theo branch</h3><div class="cwrap"><canvas id="c-branch"></canvas></div></div>

      <div class="chart-card wide"><h3>Hoạt động theo thời gian <span class="hint" id="act-hint"></span></h3><div class="cwrap tall"><canvas id="c-activity"></canvas></div></div>

      <div class="chart-card"><h3>Session theo project</h3><div class="cwrap"><canvas id="c-proj"></canvas></div></div>
      <div class="chart-card"><h3>Tokens theo project (in/out)</h3><div class="cwrap"><canvas id="c-tokens"></canvas></div></div>
      <div class="chart-card"><h3>Tool calls theo project</h3><div class="cwrap"><canvas id="c-tools"></canvas></div></div>

      <div class="chart-card half"><h3>Top session theo thời lượng</h3><div class="cwrap tall"><canvas id="c-dur"></canvas></div></div>
      <div class="chart-card half"><h3>Top session theo tokens</h3><div class="cwrap tall"><canvas id="c-toptok"></canvas></div></div>
    </div>
  </main>

  <script src="/common.js"></script>
  <script src="/dashboard.js"></script>
</body>
</html>
