<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dashboard — LAAM</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236d5efc'/><text x='50' y='68' font-size='52' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>L</text></svg>" />
  <script src="/vendor/chart.umd.min.js"></script>
  <script src="/vendor/jspdf.umd.min.js"></script>
</head>
<body>
  <header id="topbar"></header>

  <main id="main" class="dash">
    <div class="dash-toolbar">
      <div class="stuck-alert" id="stuck-alert" hidden></div>
      <div class="spacer"></div>
      <button class="fsel" id="exp-csv" data-i18n-title="dash.exp.csvTitle" title="Xuất toàn bộ session ra CSV"><span class="lc-ico"></span><span data-i18n="dash.exp.csv">CSV session</span></button>
      <button class="fsel" id="exp-pdf" data-i18n-title="dash.exp.pdfTitle" title="Xuất báo cáo tổng hợp ra PDF"><span class="lc-ico"></span><span data-i18n="dash.exp.pdf">PDF báo cáo</span></button>
    </div>
    <div class="kpis" id="kpis"></div>

    <div class="charts">
      <div class="chart-card"><h3 data-i18n="dash.chart.status">Trạng thái session</h3><div class="cwrap"><canvas id="c-status"></canvas></div></div>
      <div class="chart-card"><h3 data-i18n="dash.chart.model">Phân bố theo model</h3><div class="cwrap"><canvas id="c-model"></canvas></div></div>
      <div class="chart-card"><h3 data-i18n="dash.chart.branch">Phân bố theo branch</h3><div class="cwrap"><canvas id="c-branch"></canvas></div></div>

      <div class="chart-card wide"><h3><span data-i18n="dash.chart.activity">Hoạt động theo thời gian</span> <span class="hint" id="act-hint"></span></h3><div class="cwrap tall"><canvas id="c-activity"></canvas></div></div>

      <div class="chart-card"><h3 data-i18n="dash.chart.proj">Session theo project</h3><div class="cwrap"><canvas id="c-proj"></canvas></div></div>
      <div class="chart-card"><h3 data-i18n="dash.chart.tokens">Tokens theo project (in/out)</h3><div class="cwrap"><canvas id="c-tokens"></canvas></div></div>
      <div class="chart-card"><h3 data-i18n="dash.chart.tools">Tool calls theo project</h3><div class="cwrap"><canvas id="c-tools"></canvas></div></div>

      <div class="chart-card half"><h3 data-i18n="dash.chart.topDur">Top session theo thời lượng</h3><div class="cwrap tall"><canvas id="c-dur"></canvas></div></div>
      <div class="chart-card half"><h3 data-i18n="dash.chart.topTok">Top session theo tokens</h3><div class="cwrap tall"><canvas id="c-toptok"></canvas></div></div>
    </div>

    <!-- Pluggable feature modules render their own cards here. -->
    <div class="charts" id="modules"></div>
  </main>
  <script src="/i18n.js"></script>
  <script src="/i18n.dash.js"></script>
  <script src="/vendor/lucide-icons.js"></script>

  <script src="/common.js"></script>
  <script src="/export.js"></script>
  <!-- Dashboard feature modules (each self-registers into LAAM.dashModules). -->
  <script src="/dash-cost.js"></script>
  <script src="/dash-heatmap.js"></script>
  <script src="/dash-tools.js"></script>
  <script src="/dash-models.js"></script>
  <script src="/dashboard.js"></script>
</body>
</html>
