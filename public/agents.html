<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agents — LAAM</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236d5efc'/><text x='50' y='68' font-size='52' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>L</text></svg>" />
</head>
<body>
  <header id="topbar"></header>

  <div class="filterbar" id="filterbar">
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="Tìm project / agent / task…" />
    </label>
    <select class="fsel" id="f-project"><option value="">Mọi project</option></select>
    <select class="fsel" id="f-model"><option value="">Mọi model</option></select>
    <select class="fsel" id="f-status">
      <option value="">Mọi trạng thái</option>
      <option value="running">Đang chạy</option>
      <option value="idle">Tạm dừng</option>
      <option value="done">Hoàn tất</option>
    </select>
    <select class="fsel" id="f-branch"><option value="">Mọi branch</option></select>
    <select class="fsel" id="f-time">
      <option value="">Mọi thời điểm</option>
      <option value="3600000">1 giờ qua</option>
      <option value="21600000">6 giờ qua</option>
      <option value="86400000">24 giờ qua</option>
      <option value="604800000">7 ngày qua</option>
    </select>
    <button class="fsel ghost" id="f-clear">Xoá lọc</button>
    <span class="fcount" id="f-count"></span>
  </div>

  <main id="main">
    <div class="empty"><div class="big">Đang tải dữ liệu agents…</div></div>
  </main>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <div>
        <h3 id="d-title">—</h3>
        <div class="dp" id="d-path"></div>
      </div>
      <button class="iconbtn" id="d-close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="d-body"></div>
  </aside>

  <script src="/common.js"></script>
  <script src="/agents.js"></script>
</body>
</html>
