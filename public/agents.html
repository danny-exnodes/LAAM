<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Agents — LAAM</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236d5efc'/><text x='50' y='68' font-size='52' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>L</text></svg>" />
</head>
<body>
  <header id="topbar"></header>

  <div class="filterbar" id="filterbar">
    <label class="search">
      <span class="search-ic" id="search-ic"></span>
      <input id="search" type="text" placeholder="Tìm project / agent / task…" data-i18n-ph="agents.searchPh" />
    </label>
    <select class="fsel" id="f-source">
      <option value="" data-i18n="agents.srcAll">Mọi nguồn</option>
      <option value="claude">Claude</option>
      <option value="local" data-i18n="agents.srcLocal">Local (Ollama)</option>
    </select>
    <select class="fsel" id="f-project"><option value="" data-i18n="agents.projAll">Mọi project</option></select>
    <select class="fsel" id="f-model"><option value="" data-i18n="agents.modelAll">Mọi model</option></select>
    <select class="fsel" id="f-status">
      <option value="" data-i18n="agents.statusAll">Mọi trạng thái</option>
      <option value="running" data-i18n="status.running">Đang chạy</option>
      <option value="idle" data-i18n="status.idle">Tạm dừng</option>
      <option value="done" data-i18n="status.done">Hoàn tất</option>
      <option value="stuck" data-i18n="agents.statusStuck">Nghi kẹt</option>
    </select>
    <select class="fsel" id="f-branch"><option value="" data-i18n="agents.branchAll">Mọi branch</option></select>
    <select class="fsel" id="f-time">
      <option value="" data-i18n="agents.timeAll">Mọi thời điểm</option>
      <option value="3600000" data-i18n="agents.time1h">1 giờ qua</option>
      <option value="21600000" data-i18n="agents.time6h">6 giờ qua</option>
      <option value="86400000" data-i18n="agents.time24h">24 giờ qua</option>
      <option value="604800000" data-i18n="agents.time7d">7 ngày qua</option>
    </select>
    <button class="fsel ghost" id="f-clear" data-i18n="agents.clear">Xoá lọc</button>
    <button class="fsel" id="f-export" title="Xuất CSV các session đang hiển thị" data-i18n-title="agents.exportTitle"><span class="f-export-ic" id="f-export-ic"></span><span data-i18n="agents.exportCsv">CSV</span></button>
    <span class="fcount" id="f-count"></span>
  </div>

  <main id="main">
    <div class="empty"><div class="big" data-i18n="agents.loading">Đang tải dữ liệu agents…</div></div>
  </main>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <div>
        <h3 id="d-title">—</h3>
        <div class="dp" id="d-path"></div>
      </div>
      <button class="iconbtn" id="d-close" aria-label="Close"></button>
    </div>
    <div class="drawer-body" id="d-body"></div>
  </aside>
  <script src="/i18n.js"></script>
  <script src="/i18n.agents.js"></script>
  <script src="/vendor/lucide-icons.js"></script>

  <script src="/common.js"></script>
  <script src="/export.js"></script>
  <script src="/agents.js"></script>
</body>
</html>
