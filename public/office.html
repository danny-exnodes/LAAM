<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Office — LAAM</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236d5efc'/><text x='50' y='68' font-size='52' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>L</text></svg>" />
</head>
<body>
  <header id="topbar"></header>

  <main class="office" id="office">
    <!-- Iso scene -->
    <div class="office-stage" id="stage">
      <div class="office-scene" id="scene">
        <div class="office-floor" id="floor"></div>
        <svg class="office-rooms" id="rooms" width="100%" height="100%"></svg>
        <div class="office-furniture" id="furniture"></div>
        <div class="office-agents" id="agents"></div>
        <div class="office-plaques" id="plaques"></div>
        <svg class="office-links" id="links" width="100%" height="100%"></svg>
      </div>
    </div>

    <!-- Overlays (filled by office-panels.js) -->
    <div class="office-panel connected" id="panel-connected"></div>
    <div class="office-panel analytics" id="panel-analytics"></div>
    <div class="office-panel console" id="panel-console"></div>

    <div class="office-controls" id="controls">
      <button class="fsel" id="zoom-out" data-i18n-title="office.zoomOut" data-i18n-aria="office.zoomOut">−</button>
      <button class="fsel" id="zoom-in" data-i18n-title="office.zoomIn" data-i18n-aria="office.zoomIn">+</button>
      <button class="fsel ghost" id="zoom-fit" data-i18n="office.fit">Canh giữa</button>
      <label class="gchk"><input type="checkbox" id="show-done" /> <span data-i18n="office.showDone">Hiện hoàn tất</span></label>
    </div>
  </main>

  <!-- Detail drawer (reused pattern) -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <div><h3 id="d-title">—</h3><div class="dp" id="d-path"></div></div>
      <button class="iconbtn" id="d-close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="drawer-body" id="d-body"></div>
  </aside>
  <script src="/i18n.js"></script>
  <script src="/i18n.office.js"></script>

  <script src="/common.js"></script>
  <script src="/office-sprites.js"></script>
  <script src="/office-panels.js"></script>
  <script src="/office.js"></script>
</body>
</html>
