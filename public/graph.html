<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Graph — LAAM</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236d5efc'/><text x='50' y='68' font-size='52' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>L</text></svg>" />
  <script src="/vendor/vis-network.min.js"></script>
</head>
<body>
  <header id="topbar"></header>

  <div class="filterbar">
    <select class="fsel" id="g-project"><option value="" data-i18n="graph.allProjects">Mọi project</option></select>
    <label class="gchk"><input type="checkbox" id="g-physics" checked /> <span data-i18n="graph.physics">Physics</span></label>
    <button class="fsel ghost" id="g-fit" data-i18n="graph.fit">Canh giữa</button>
    <span class="glegend">
      <span class="lg"><i style="background:#6d5efc"></i><span data-i18n="graph.legendProject">Project</span></span>
      <span class="lg"><i style="background:#16a34a"></i><span data-i18n="graph.legendOrchestrator">Orchestrator</span></span>
      <span class="lg"><i style="background:#0ea5e9"></i><span data-i18n="graph.legendSub">Sub-agent</span></span>
    </span>
    <span class="fcount" id="g-count"></span>
  </div>

  <main class="graphmain">
    <div id="net"></div>
    <aside class="gpanel" id="gpanel">
      <div class="gpanel-empty" id="gpanel-empty" data-i18n="graph.emptyHint">Bấm vào một node để xem chi tiết.</div>
      <div id="gpanel-body" style="display:none"></div>
    </aside>
  </main>
  <script src="/i18n.js"></script>
  <script src="/i18n.graphsearch.js"></script>

  <script src="/common.js"></script>
  <script src="/graph.js"></script>
</body>
</html>
