# LAAM v2 — DEV INFRA ONLY (Postgres + Adminer).
# The app itself runs on the host via `npm run dev` (port 3000). Ollama stays
# native on the host (GPU). The old v0.9 stack (its own compose) runs separately
# and untouched.
#
#   docker compose up -d            # start Postgres + Adminer
#   docker compose down             # stop (data persists in the volume)
#   docker compose down -v          # stop and WIPE the database
services:
  postgres:
    image: postgres:16-alpine
    container_name: laam-v2-postgres
    environment:
      POSTGRES_USER: laam
      POSTGRES_PASSWORD: laam
      POSTGRES_DB: laam
    ports:
      - "5432:5432"
    volumes:
      - laam-v2-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laam -d laam"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Lightweight DB UI at http://localhost:8080 (System: PostgreSQL, Server:
  # postgres, User/Pass/DB: laam).
  adminer:
    image: adminer:latest
    container_name: laam-v2-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: unless-stopped

  # LAAM v2 production app (standalone Next.js, built from the infra/docker-stack
  # worktree: `docker build -t laam-app:latest <worktree>`). Reaches Postgres
  # internally (postgres:5432) and host-native GPU Ollama via host.docker.internal.
  # Published on the dedicated 39xx block; public via Tailscale Funnel -> :3900.
  app:
    image: laam-app:latest
    container_name: laam-v2-app
    ports:
      - "3900:3000"
    env_file:
      - .env
    environment:
      # These override env_file: point at the in-network DB + host Ollama, and
      # tell Auth.js it sits behind the Funnel HTTPS proxy.
      DATABASE_URL: postgresql://laam:laam@postgres:5432/laam
      OLLAMA_URL: http://host.docker.internal:11434
      HOST_METRICS_URL: http://host.docker.internal:47600
      SEARXNG_URL: http://searxng:8080
      AUTH_TRUST_HOST: "true"
      AUTH_URL: https://danny-gaming-pc.tail41dda4.ts.net
      NODE_ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Self-hosted metasearch (FOSS, $0) — powers the web_search harness tool. JSON API
  # enabled in searxng/settings.yml; limiter off (single-user). Bound to localhost ONLY
  # (internal dependency, never exposed). Dev (host `npm run dev`) reaches it at
  # http://localhost:8888; the prod app container reaches it in-network at
  # http://searxng:8080 (see the app service's SEARXNG_URL override above). The app
  # does NOT depend_on searxng — web_search fails soft if it is down.
  searxng:
    image: searxng/searxng:latest
    container_name: laam-v2-searxng
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
    restart: unless-stopped

volumes:
  laam-v2-pg:
