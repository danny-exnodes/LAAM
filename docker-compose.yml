# LAAM v2 — production stack (app + adminer + searxng). Postgres is the SHARED
# ecosystem-infra instance (container `infra-pg`, reachable in-network as `postgres`
# on the external `ecosystem-net`); LAAM no longer runs its own Postgres container.
# The app also runs on the host via `npm run dev` (Ollama native/GPU).
#
#   docker compose up -d            # start app + adminer + searxng (DB = shared infra)
#   docker compose down             # stop (the shared DB + its data are untouched)
# Migrated off the local Postgres on 2026-06-16 (Phase 2 ecosystem-infra migration);
# host DB port is now :5500 (shared), the old :5434 is retired.
services:
  # Lightweight DB UI at http://localhost:8080 (System: PostgreSQL, Server: postgres; credentials: see .env). Loopback only (spec §11.6.6).
  # On ecosystem-net → `postgres` = shared infra-pg.
  adminer:
    image: adminer:latest
    container_name: laam-v2-adminer
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - default
      - ecosystem-net
    restart: unless-stopped

  # LAAM v2 production app (standalone Next.js, built from the infra/docker-stack
  # worktree: `docker build -t laam-app:latest <worktree>`). Reaches Postgres
  # internally (postgres:5432) and host-native GPU Ollama via host.docker.internal.
  # Published on the dedicated 39xx block; public via Tailscale Funnel -> :3900.
  app:
    image: laam-app:latest
    container_name: laam-v2-app
    ports:
      - "3900:3000"
    env_file:
      - .env
    environment:
      # These override env_file: point at the in-network DB + host Ollama, and
      # tell Auth.js it sits behind the Funnel HTTPS proxy.
      # In-network DB URL (postgres:5432) — kept in .env, never in this file (spec §11.6.6).
      DATABASE_URL: ${LAAM_DOCKER_DATABASE_URL:?set LAAM_DOCKER_DATABASE_URL in .env}
      OLLAMA_URL: http://host.docker.internal:11434
      HOST_METRICS_URL: http://host.docker.internal:47600
      SEARXNG_URL: http://searxng:8080
      # Voice for /constellation. Default: Google Cloud TTS (Chirp 3 HD), no local
      # container. GOOGLE_TTS_CREDENTIALS_B64 (base64 of the service-account JSON)
      # and the optional GOOGLE_TTS_VOICE come from .env via env_file. To switch back
      # to the self-hosted VieNeu: TTS_ENGINE=vieneu in .env AND start its profile
      # (`docker compose --profile vieneu up -d`), see the vieneu-tts service below.
      TTS_ENGINE: ${TTS_ENGINE:-google}
      CONSTELLATION_TTS_URL: http://vieneu-tts:5002/tts
      AUTH_TRUST_HOST: "true"
      # Auth.js builds every redirect (incl. sign-out → /login) from this URL.
      # Override per host via LAAM_AUTH_URL in .env; defaults to the Funnel host.
      AUTH_URL: ${LAAM_AUTH_URL:-https://danny-gaming-pc.tail41dda4.ts.net}
      NODE_ENV: production
      # Industry packs (writable mount, see volumes): Settings > Industry templates
      # installs, updates and rolls back versions in place. PACKS_SOURCE is the pack
      # registry base URL and PACKS_TOKEN its read token; both are interpolated from
      # the environment / this directory's .env (they override env_file; empty =
      # installs disabled).
      PACKS_DIR: /packs
      PACKS_SOURCE: ${PACKS_SOURCE:-}
      PACKS_TOKEN: ${PACKS_TOKEN:-}
    volumes:
      # Host dir must exist and be writable by the container user (node, uid 1000).
      # Use an absolute PACKS_HOST_DIR: a relative one resolves against this file's
      # directory (LAAM/), unlike the workspace compose.
      - ${PACKS_HOST_DIR:-../ennam.kg.packs}:/packs
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # Container DNS can't resolve Tailscale MagicDNS names. The daab-pharmacy-chain
      # MCP connector is configured (in the DB, encrypted) with this Tailscale
      # hostname; map it to the host's actual tailnet IP (NOT host-gateway, which
      # resolves to a Docker Desktop private-NAT IP). That tailnet IP is CGNAT
      # (100.64.0.0/10), which the SSRF guard blocks for every MCP server unless the
      # connector's EXACT host:port is listed in MCP_HOST_ALLOWLIST (.env), e.g.
      # MCP_HOST_ALLOWLIST=macbook-pro-ca-danh.tail41dda4.ts.net:8765 — without it
      # the DAAB tools disappear. This mapping alone no longer lets it through.
      - "macbook-pro-ca-danh.tail41dda4.ts.net:100.113.149.106"
    networks:
      # `default` for app↔searxng; `ecosystem-net` so DATABASE_URL host `postgres`
      # resolves to the shared infra-pg (DATABASE_URL itself is unchanged).
      - default
      - ecosystem-net
    restart: unless-stopped

  # Schedule poker: POST /api/workflows/tick every 60s (tick-auth accepts localhost
  # OR a matching x-workflow-tick-secret header; from another container only the
  # secret works, so WORKFLOW_TICK_SECRET must be set in .env; the container exits 1 with an error if empty). Hits the app on its
  # internal port 3000.
  tick:
    image: curlimages/curl:8.10.1
    container_name: laam-v2-tick
    restart: unless-stopped
    depends_on: [app]
    environment:
      TICK_SECRET: ${WORKFLOW_TICK_SECRET:-}
    entrypoint: ["/bin/sh","-c","if [ -z \"$$TICK_SECRET\" ]; then echo 'tick: WORKFLOW_TICK_SECRET is not set (tick-auth only accepts localhost without it); set it in LAAM/.env' >&2; exit 1; fi; while true; do curl -fsS -X POST -H \"x-workflow-tick-secret: $$TICK_SECRET\" http://app:3000/api/workflows/tick >/dev/null || true; sleep 60; done"]

  # Self-hosted VieNeu TTS (FOSS, MIT) — backs CONSTELLATION_TTS_URL for the
  # /constellation voice command-center. Bound to localhost ONLY (internal
  # dependency, never exposed). Dev (host `npm run dev`) reaches it at
  # http://localhost:5002/tts; the prod app container reaches it in-network at
  # http://vieneu-tts:5002/tts (see the app service's env override above).
  # Renamed from piper-tts (2026-07-23): Piper was dropped in favor of VieNeu for
  # both languages (see app.py) and the folder/service name had gone stale.
  #
  # Hidden by default (2026-10-22): the app now speaks through Google Cloud TTS, so
  # a plain `docker compose up -d` neither builds nor starts this service. Re-enable
  # with `docker compose --profile vieneu up -d` plus TTS_ENGINE=vieneu in .env.
  vieneu-tts:
    profiles: ["vieneu"]
    build: ./vieneu-tts
    container_name: laam-v2-vieneu-tts
    ports:
      - "127.0.0.1:5002:5002"
    # Leave most of the machine to the browser. Uncapped, VieNeu saturated ALL 12 cores
    # (measured 1374% CPU) and starved Chrome's main thread — the whole page froze for
    # 1-2s each time a reply was synthesized.
    #
    # The thread limits below are NOT optional: an earlier attempt capped `cpus` alone
    # and was reverted because playback fell apart. Measured cause — the engine still
    # spawned a thread per host core, so those threads thrashed inside the smaller cgroup
    # quota and got throttled every period. Matching threads to the quota removes the
    # thrashing entirely, and capping this way is FASTER than running uncapped.
    # Measured warm (same text, real time factor = audio produced / wall clock):
    #   12 cores, unlimited threads -> 0.98x  (and freezes the UI — 1374% CPU)
    #   10 cores, 10 threads        -> 2.05x
    #    6 cores,  6 threads        -> 3.63x
    #    4 cores,  4 threads        -> 3.73x
    #    3 cores,  3 threads        -> 3.58x   (this config — 9 cores left for the browser)
    #    2 cores,  2 threads        -> 3.06x
    # Throughput is nearly flat from 2-6 cores: this model barely parallelizes, so almost
    # everything above ~3 cores was thrashing overhead, not useful work. 3.58x is far
    # ahead of playback (the client also prebuffers 3s and prefetches the next segment).
    # If audio ever starts stuttering, raise BOTH numbers together — never one alone.
    cpus: 3
    environment:
      OMP_NUM_THREADS: "3"
      MKL_NUM_THREADS: "3"
      ORT_NUM_THREADS: "3"
      OPENBLAS_NUM_THREADS: "3"
      NUMEXPR_NUM_THREADS: "3"
      TORCH_NUM_THREADS: "3"
    restart: unless-stopped

  # Self-hosted metasearch (FOSS, $0) — powers the web_search harness tool. JSON API
  # enabled in searxng/settings.yml; limiter off (single-user). Bound to localhost ONLY
  # (internal dependency, never exposed). Dev (host `npm run dev`) reaches it at
  # http://localhost:8888; the prod app container reaches it in-network at
  # http://searxng:8080 (see the app service's SEARXNG_URL override above). The app
  # does NOT depend_on searxng — web_search fails soft if it is down.
  searxng:
    image: searxng/searxng:latest
    container_name: laam-v2-searxng
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
    restart: unless-stopped

networks:
  # Shared ecosystem-infra network (created externally by SharedContainers). app +
  # adminer join it so the in-network DNS name `postgres` resolves to shared infra-pg.
  ecosystem-net:
    external: true