# macOS override — run proxy + LAAM in Docker against the HOST's native,
# GPU-accelerated Ollama (Docker Desktop on macOS cannot pass through the Apple
# GPU, so the in-compose `ollama` service would be CPU-only). Bind-mounts the
# host log + transcript dirs so data is shared with any native tooling.
#
# Usage (does NOT start the in-Docker ollama service):
#   docker compose -f docker-compose.yml -f docker-compose.macos.yml up -d --no-deps proxy laam
#
# Prereq: native Ollama running on the host (`ollama serve`, port 11434) with
# the model(s) pulled. ngrok keeps pointing at host :4317 (the laam container).
services:
  proxy:
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
    volumes:
      - ${HOME}/.laam/local-logs:/data/local-logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
  laam:
    volumes:
      - ${HOME}/.claude/projects:/claude-projects:ro
      - ${HOME}/.laam/local-logs:/data/local-logs:ro
