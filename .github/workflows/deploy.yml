name: Deploy LAAM DEV

on:
  push:
    branches:
      - deploy-dev

concurrency:
  group: laam-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 30m
          script_stop: true

          script: |
            cd /home/ubuntu/laam
            chmod +x deploy.sh
            ./deploy.sh